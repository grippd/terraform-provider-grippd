# Pushing a tag like v0.1.0 builds, signs and publishes a release the OpenTofu registry picks up.
# Needs two repository secrets: GPG_PRIVATE_KEY (ASCII-armoured) and PASSPHRASE.
# The passphrase reaches gpg on stdin (GoReleaser's signs.stdin), never on a command line.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: mise run test
      # Plain gpg and the GoReleaser mise pins: the org allows no third-party actions near the key.
      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG_FINGERPRINT=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"
      - name: Release
        run: mise exec -- goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
